name: Validate Momentum 10 Scanner

on:
  push:
    paths:
      - "scanner.py"
      - "market_filters.py"
      - "breakout_retest_filter.py"
      - "test_market_filters.py"
      - "test_breakout_retest_filter.py"
      - "requirements.txt"
      - ".github/workflows/scanner.yml"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner requirements
        run: python -m pip install -r requirements.txt
      - name: Compile scanner modules
        run: python -m py_compile scanner.py breakout_retest_filter.py market_filters.py
      - name: Run market and breakout/retest regression tests
        run: python -m unittest test_market_filters test_breakout_retest_filter -v

name: Validate Breakout & Retest Scanner

on:
  push:
    paths:
      - "scanner.py"
      - "session_reporting.py"
      - "test_session_reporting.py"
      - "payout_recovery.py"
      - "test_payout_recovery.py"
      - "breakout_retest_filter.py"
      - "trend_filter.py"
      - "test_trend_filter.py"
      - "test_breakout_retest_filter.py"
      - "execution_guard.py"
      - "test_execution_guard.py"
      - "broker_results.py"
      - "test_broker_results.py"
      - "ema_strategy.py"
      - "ema_martingale.py"
      - "test_ema_martingale.py"
      - "test_ema_strategy.py"
      - "requirements.txt"
      - ".github/workflows/scanner.yml"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner requirements
        run: python -m pip install -r requirements.txt
      - name: Compile scanner modules
        run: python -m py_compile scanner.py session_reporting.py payout_recovery.py breakout_retest_filter.py trend_filter.py execution_guard.py broker_results.py ema_strategy.py ema_martingale.py
      - name: Run breakout/retest, exposure, and broker-result regression tests
        run: python -m unittest test_breakout_retest_filter test_trend_filter test_execution_guard test_broker_results test_ema_strategy test_ema_martingale test_session_reporting test_payout_recovery -v

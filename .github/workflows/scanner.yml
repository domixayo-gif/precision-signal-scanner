name: Back to Trend IQ Option OTC Scanner

on:

  workflow_dispatch:

  schedule:
    # Starts a new 24-hour session every day.
    # GitHub Actions cron uses UTC.
    - cron: "0 0 * * *"


jobs:

  scanner:

    runs-on: ubuntu-latest

    # GitHub Actions maximum job runtime.
    # 1440 minutes = 24 hours.
    timeout-minutes: 1440

    permissions:
      contents: read

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install "requests>=2.28,<3"

          pip install "websocket-client>=1.5,<2"

          pip install \
            "git+https://github.com/victalejo/iqoptionapi.git"


      # ------------------------------------------------------
      # RUN SCANNER
      # ------------------------------------------------------

      - name: Run Back to Trend scanner
        env:

          IQ_EMAIL: ${{ secrets.IQ_EMAIL }}

          IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          echo "========================================"
          echo "BACK TO TREND IQ OPTION OTC SCANNER"
          echo "========================================"
          echo "Starting 24-hour scanner session..."
          echo "5M context + 1M entry"
          echo "5-minute expiry"
          echo "Read-only mode"
          echo "========================================"

          python scanner.py

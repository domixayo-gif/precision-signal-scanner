name: Breakout & Retest IQ Option Scanner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scanner.py"
      - "breakout_retest_filter.py"
      - "trend_filter.py"
      - "test_trend_filter.py"
      - "execution_guard.py"
      - "momentum_strategy.py"
      - "ema_strategy.py"
      - "test_momentum_strategy.py"
      - "test_ema_strategy.py"
      - "fusion_strategy.py"
      - "test_fusion_strategy.py"
      - "test_breakout_retest_filter.py"
      - "test_execution_guard.py"
      - "broker_results.py"
      - "test_broker_results.py"
      - "requirements.txt"
      - ".github/workflows/scanner.yml"
  push:
    branches: [main]
    paths:
      - "scanner.py"
      - "breakout_retest_filter.py"
      - "execution_guard.py"
      - "momentum_strategy.py"
      - "ema_strategy.py"
      - "test_momentum_strategy.py"
      - "test_ema_strategy.py"
      - "test_breakout_retest_filter.py"
      - "test_execution_guard.py"
      - "broker_results.py"
      - "test_broker_results.py"
      - "requirements.txt"
      - ".github/workflows/scanner.yml"
  schedule:
    # Restart before the 350-minute runner limit so Telegram polling has less downtime.
    - cron: "0 */4 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  # Stable name: a workflow rename must not create a second live Telegram poller.
  group: iq-option-practice-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check scanner
        run: |
          python -m py_compile scanner.py breakout_retest_filter.py trend_filter.py execution_guard.py broker_results.py momentum_strategy.py ema_strategy.py fusion_strategy.py
          python -m unittest test_breakout_retest_filter test_trend_filter test_execution_guard test_broker_results test_momentum_strategy test_ema_strategy test_fusion_strategy -v

      - name: Cancel older scanner workflow instances
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REF: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          repo = os.environ["GH_REPOSITORY"]
          current_run = int(os.environ["GH_RUN_ID"])
          branch = os.environ["GH_REF"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          active_states = {"queued", "pending", "in_progress", "waiting", "requested"}
          response = requests.get(
              f"{api}/repos/{repo}/actions/runs",
              headers=headers,
              params={"branch": branch, "per_page": 100},
              timeout=20,
          )
          response.raise_for_status()
          runs = response.json().get("workflow_runs", [])
          cancelled = 0
          for run in runs:
              run_id = int(run.get("id", 0))
              if run_id == current_run:
                  continue
              if run.get("path") != ".github/workflows/scanner.yml":
                  continue
              if run.get("status") not in active_states:
                  continue
              print(f"Cancelling old scanner run {run_id}: {run.get('name')} ({run.get('status')})")
              cancel_url = f"{api}/repos/{repo}/actions/runs/{run_id}/cancel"
              cancel_response = requests.post(cancel_url, headers=headers, timeout=20)
              if cancel_response.status_code == 202:
                  time.sleep(3)
                  status_response = requests.get(
                      f"{api}/repos/{repo}/actions/runs/{run_id}",
                      headers=headers,
                      timeout=20,
                  )
                  status_response.raise_for_status()
                  state = status_response.json().get("status")
                  if state in active_states:
                      print(f"Run {run_id} did not stop after cancel (status={state}); force-cancelling")
                      force_response = requests.post(
                          f"{api}/repos/{repo}/actions/runs/{run_id}/force-cancel",
                          headers=headers,
                          timeout=20,
                      )
                      if force_response.status_code not in (202, 409):
                          force_response.raise_for_status()
                  else:
                      print(f"Run {run_id} stopped: {state}")
              elif cancel_response.status_code == 409:
                  force_response = requests.post(
                      f"{api}/repos/{repo}/actions/runs/{run_id}/force-cancel",
                      headers=headers,
                      timeout=20,
                  )
                  if force_response.status_code not in (202, 409):
                      force_response.raise_for_status()
              else:
                  cancel_response.raise_for_status()
              cancelled += 1
          print(f"Old scanner cleanup complete; cancellation requests sent: {cancelled}")
          PY
      - name: Run Breakout & Retest scanner
        if: github.event_name != 'pull_request'
        env:
          IQ_EMAIL: ${{ secrets.IQ_EMAIL }}
          IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python scanner.py

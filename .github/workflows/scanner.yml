name: Breakout & Retest IQ Option Scanner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scanner.py"
      - "breakout_retest_filter.py"
      - "execution_guard.py"
      - "test_breakout_retest_filter.py"
      - "test_execution_guard.py"
      - "broker_results.py"
      - "test_broker_results.py"
      - "requirements.txt"
      - ".github/workflows/scanner.yml"
  push:
    branches: [main]
    paths:
      - "scanner.py"
      - "breakout_retest_filter.py"
      - "execution_guard.py"
      - "test_breakout_retest_filter.py"
      - "test_execution_guard.py"
      - "broker_results.py"
      - "test_broker_results.py"
      - "requirements.txt"
      - ".github/workflows/scanner.yml"
  schedule:
    # Fallback start every 6 hours if a dispatch fails.
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  # Stable name: a workflow rename must not create a second live Telegram poller.
  group: iq-option-practice-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check scanner
        run: |
          python -m py_compile scanner.py breakout_retest_filter.py execution_guard.py broker_results.py
          python -m unittest test_breakout_retest_filter test_execution_guard test_broker_results -v

      - name: Cancel older scanner workflow instances
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_REF: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import requests

          repo = os.environ["GH_REPOSITORY"]
          current_run = int(os.environ["GH_RUN_ID"])
          branch = os.environ["GH_REF"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          response = requests.get(
              f"{api}/repos/{repo}/actions/runs",
              headers=headers,
              params={"branch": branch, "per_page": 100},
              timeout=20,
          )
          response.raise_for_status()
          runs = response.json().get("workflow_runs", [])
          cancelled = 0
          for run in runs:
              if int(run.get("id", 0)) == current_run:
                  continue
              if run.get("path") != ".github/workflows/scanner.yml":
                  continue
              if run.get("status") not in ("queued", "in_progress"):
                  continue
              run_id = int(run["id"])
              print(f"Cancelling duplicate scanner run {run_id}: {run.get('name')} ({run.get('status')})")
              result = requests.post(
                  f"{api}/repos/{repo}/actions/runs/{run_id}/cancel",
                  headers=headers,
                  timeout=20,
              )
              if result.status_code not in (202, 409, 422):
                  result.raise_for_status()
              cancelled += 1
          print(f"Duplicate scanner cleanup complete; cancellation requests sent: {cancelled}")
          PY
      - name: Run Breakout & Retest scanner
        if: github.event_name != 'pull_request'
        env:
          IQ_EMAIL: ${{ secrets.IQ_EMAIL }}
          IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python scanner.py

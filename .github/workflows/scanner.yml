name: Breakout & Retest IQ Option Scanner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scanner.py"
      - "breakout_retest_filter.py"
      - "execution_guard.py"
      - "test_breakout_retest_filter.py"
      - "test_execution_guard.py"
      - "broker_results.py"
      - "test_broker_results.py"
      - "requirements.txt"
      - ".github/workflows/scanner.yml"
  push:
    branches: [main]
    paths:
      - "scanner.py"
      - "breakout_retest_filter.py"
      - "execution_guard.py"
      - "test_breakout_retest_filter.py"
      - "test_execution_guard.py"
      - "broker_results.py"
      - "test_broker_results.py"
      - "requirements.txt"
      - ".github/workflows/scanner.yml"
  schedule:
    # Fallback start every 6 hours if a dispatch fails.
    - cron: "0 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check scanner
        run: |
          python -m py_compile scanner.py breakout_retest_filter.py execution_guard.py broker_results.py
          python -m unittest test_breakout_retest_filter test_execution_guard test_broker_results -v

      - name: Run Breakout & Retest scanner
        if: github.event_name != 'pull_request'
        env:
          IQ_EMAIL: ${{ secrets.IQ_EMAIL }}
          IQ_PASSWORD: ${{ secrets.IQ_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python scanner.py

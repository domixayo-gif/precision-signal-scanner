name: IQ Option Scanner Watchdog

on:
  workflow_dispatch:
  schedule:
    # Check every 10 minutes and restart the scanner if no scanner run is active.
    - cron: "*/10 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: iq-option-scanner-watchdog
  cancel-in-progress: false

jobs:
  ensure-scanner-running:
    runs-on: ubuntu-latest
    steps:
      - name: Start scanner only when no scanner run is active
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          active_states = {"queued", "pending", "in_progress", "waiting", "requested"}

          request = urllib.request.Request(
              f"{api}/repos/{repo}/actions/runs?branch=main&per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              runs = json.loads(response.read().decode("utf-8")).get("workflow_runs", [])
          active = [
              run for run in runs
              if run.get("path") == ".github/workflows/scanner.yml"
              and run.get("status") in active_states
          ]

          if active:
              newest = max(active, key=lambda run: run.get("created_at", ""))
              print(
                  "Scanner already has an active run; no restart needed: "
                  f"run #{newest.get('run_number')} ({newest.get('status')})."
              )
              raise SystemExit(0)

          payload = json.dumps({"ref": "main"}).encode("utf-8")
          dispatch_request = urllib.request.Request(
              f"{api}/repos/{repo}/actions/workflows/scanner.yml/dispatches",
              data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(dispatch_request, timeout=20) as response:
                  if response.status != 204:
                      raise SystemExit(f"Workflow dispatch returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              raise SystemExit(
                  f"Workflow dispatch failed: HTTP {error.code} {error.read().decode('utf-8')}"
              )

          print("No scanner run was active. Dispatched a fresh scanner workflow.")
          PY
